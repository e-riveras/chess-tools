name: Sync Chess Games

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual run
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Stockfish Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "STOCKFISH_PATH=/usr/games/stockfish" >> $GITHUB_ENV
          stockfish --version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Sync Script
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          CHESSCOM_USERNAME: erivera90
          LOG_LEVEL: DEBUG
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python run_sync.py

      - name: Commit and Push History
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/history.json docs/analysis/ docs/drills/drills.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update import history and analysis reports"
            git pull --rebase
            git push
          fi
